on:
  release:
    types: [published]
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: ./.github/actions/setup
      - name: Verify release tag matches package versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          JSR=$(node -p "require('./jsr.json').version")
          echo "tag=$TAG pkg=$PKG jsr=$JSR"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$JSR" ]; then
            echo "::error::Tag/package/jsr versions do not match (tag=$TAG, package.json=$PKG, jsr.json=$JSR)"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
  publish-npm:
    needs: verify
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to npm
        run: pnpm publish --no-git-checks
  publish-jsr:
    needs: verify
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to JSR
        run: pnpm jsr publish
